# Increase memory during builds
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Pin the compile JVM to installed JDK 25 which targets release 21
org.gradle.java.home=C:/Program Files/Microsoft/jdk-25.0.3.9-hotspot

# Fabric versions matching user's Minecraft 1.21.11
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.5
fabric_version=0.141.6+1.21.11

# Mod properties
mod_version=1.0.0
maven_group=dev.valence.i18n
archives_base_name=valence-i18n
